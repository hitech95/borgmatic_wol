services:
  borgmatic:
    image: ghcr.io/<your-user>/<your-repo>:latest
    container_name: borgmatic
    network_mode: host
    volumes:
      - ./config:/etc/borgmatic.d
      - ./ssh:/root/.ssh:ro
      - ./state:/var/lib/borgmatic
      - /:/mnt/source:ro
    environment:
      BORG_WOL_HOST: "10.0.0.50"
      BORG_WOL_MAC: "11:22:33:44:55:66"
      BORG_WOL_TIMEOUT: "300"
      BORG_WOL_CHECK_PORT: "22"
      BORG_WOL_SSH_USER: "root"
      BORG_WOL_SSH_OPTIONS: "-o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
    restart: unless-stopped
